[package]
name = "zach-coding-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
zach-agent.workspace = true
zach-ai-core.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
async-trait.workspace = true
tokio.workspace = true
# ripgrep 的目录遍历库：遵守 .gitignore 等忽略规则
ignore = "0.4"
# 按行计算 edit 前后的统一差异
similar = "2"

[target.'cfg(unix)'.dependencies]
# 向进程组发送信号，终止命令派生的整棵进程树
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 作业对象（Job Object），终止命令派生的整棵进程树
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# 超时用例使用虚拟时钟（`start_paused`），避免真实等待
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true
futures.workspace = true
# 本地文件系统实现的用例需要真实的临时目录
tempfile = "3"
