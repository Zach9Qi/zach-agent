[package]
name = "zach-ai"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["openai", "anthropic", "rustls-tls"]
openai = ["openai-responses", "openai-chat"]
openai-responses = ["dep:base64", "dep:bytes"]
openai-chat = ["dep:base64", "dep:bytes"]
anthropic = ["dep:base64", "dep:bytes"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
zach-ai-core.workspace = true
serde_json.workspace = true
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
async-trait.workspace = true
tokio.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }

[dev-dependencies]
# 空闲超时等用例使用虚拟时钟（`start_paused`），避免真实等待
tokio = { workspace = true, features = ["test-util"] }
# 用 http::Response 构造 reqwest 响应，离线验证内容类型校验；已在 reqwest 的依赖图中
http = "1"
